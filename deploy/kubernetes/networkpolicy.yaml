# No inbound traffic at all. Outbound only DNS and the Kubernetes API (443/6443).
# Tighten the API rule to your cluster's API server address where the CNI allows it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agentmon
  namespace: agentmon
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agentmon
  policyTypes: ["Ingress", "Egress"]
  ingress: []
  egress:
    - ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - ports:
        - {protocol: TCP, port: 443}
        - {protocol: TCP, port: 6443}
