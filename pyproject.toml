[build-system]
requires = ["setuptools>=77"]  # PEP 639 license metadata
build-backend = "setuptools.build_meta"

[project]
name = "agentmon"
version = "0.1.0"
description = "Read-only anomaly monitor for AI-agent telemetry"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Joanna Bojko" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
llm = ["openai>=1.40", "azure-identity>=1.17"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.8", "mypy>=1.13"]

[project.scripts]
agentmon = "agentmon.cli:main"

[project.urls]
Repository = "https://github.com/JeanneBM/observability-monitor-agent-II"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentmon = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["agentmon"]
branch = true
omit = ["*/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "class .*\\(Protocol\\):", "\\.\\.\\."]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "S", "BLE", "C4", "PL", "PT"]
ignore = [
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004",  # complexity limits: judged in review
    "RUF001",                                               # the ellipsis character is intended
    "PLC0415",                                              # lazy imports keep optional deps optional
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "S311", "S603"]
"src/agentmon/evaluation/**" = ["S311"]  # synthetic traffic, not cryptography
"src/agentmon/cli.py" = ["S311"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src"]

[[tool.mypy.overrides]]
module = ["openai", "azure.identity"]
ignore_missing_imports = true
